<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blue Archive Modding and Patching Tool</title>
  <!-- the project's own logo (docs/logo.png), never a game asset -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="viewport">
    <div class="stage" id="stage">
      <!-- student list: rendered from the game's prefab layouts -->
      <section class="screen" id="screen-roster" hidden>
        <div class="ngui-host" id="roster"></div>
      </section>

      <!-- student detail: game background < portrait or lobby < everything else from the UICharacterDetail prefab -->
      <section class="screen" id="screen-detail" hidden>
        <div class="layer-host" id="ngui-bg"></div>
        <!-- the portrait's visual mode (js/visual-mode.js): its background under the portrait, its buttons over all -->
        <div class="visual-bg" id="visual-bg" hidden></div>
        <div class="portrait" id="portrait"></div>
        <div class="model" id="model" hidden></div>
        <div class="lobby" id="lobby" hidden></div>
        <div class="layer-host ui" id="ngui"></div>
        <div class="layer-host ui" id="ngui-chips"></div>
        <div class="layer-host ui" id="ngui-expr"></div>
        <div class="visual-ui" id="visual-ui" hidden></div>
        <button class="fs-exit" id="fs-exit" hidden aria-label="exit fullscreen"></button>
        <div class="layer-host popup-host" id="popup" hidden></div>
        <div class="layer-host popup-host" id="picker" hidden></div>
      </section>

      <section class="screen" id="screen-import" hidden>
        <div class="ngui-host" id="import"></div>
      </section>

      <!-- no game folder and similar -->
      <section class="screen message" id="screen-message" hidden>
        <h2 id="message-title"></h2>
        <p id="message-hint"></p>
        <div class="message-actions" id="message-actions"></div>
      </section>

      <header class="topbar">
        <button class="back" aria-label="back"><i class="icon-back"></i></button>
        <h1 class="title"></h1>
        <!-- the Enable Mods switch, its label and its square "?" (js/mod-switch.js); not on the no-game screen -->
        <div class="mod-switch" id="mod-switch" hidden></div>
        <!-- the game's top bar option button, at the right end -->
        <i class="top-line"></i>
        <button class="top-option" id="top-option" aria-label="settings"><i></i></button>
      </header>

      <footer class="nav">
        <div class="nav-bar"></div>
        <div class="nav-items" id="nav"></div>
      </footer>

      <!-- the loading screen (js/loading.js); the page starts covered, so nothing shows while it is built -->
      <div class="loading full on neutral" id="loading-boot" role="status">
        <div class="loading-back"></div>
        <div class="loading-ind" aria-hidden="true"><div class="loading-plain"><span></span></div></div>
      </div>

      <div class="consent-host" id="consent" hidden></div>
      <div class="consent-host settings-host" id="settings" hidden></div>
      <!-- the student list's display settings (filter and sort) -->
      <div class="consent-host settings-host" id="display" hidden></div>
      <!-- the shared popups on the stage (js/popup.js), over the settings: list prompts, and message popups over them -->
      <div class="popup-host stage-host" id="prompt" hidden></div>
      <div class="popup-host stage-host" id="dialog" hidden></div>
      <div class="toast" id="toast" hidden></div>
    </div>
  </div>

  <!-- three.js for the 3D model tab (js/model.js, loaded with the first model) -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three-0.160.0/build/three.module.min.js",
                   "three/addons/": "./vendor/three-0.160.0/examples/jsm/" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
