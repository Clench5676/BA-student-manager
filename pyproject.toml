[project]
name = "Blue-Archive-Modding-and-Patching-Tool"
version = "0.1.0-beta.3"
description = "更新、移植、修复碧蓝档案mod的工具集 | Updating&Porting&Fixing Mods for Blue Archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.4.0",
    "pywebview>=6.2.1",
    "spineatlas>=1.0.13",
    "tkinterdnd2>=0.4.3",
    "toml>=0.10.2",
    "ttkbootstrap>=1.10.1",
    "typed-argument-parser>=1.12.0",
    "unitypy==1.23.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# only the app package goes into wheels, whatever else lies under src/
include = ["ba_modding_toolkit*"]

[tool.uv.sources]
spineatlas = { git = "https://github.com/Agent-0808/SpineAtlas.git", rev = "fix/bounds-not-first" }

[project.scripts]
bamt = "ba_modding_toolkit.launcher:main"
bamt-cli = "ba_modding_toolkit.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
# collect only tests/: the checkout's root may hold the user's own data and research folders
testpaths = ["tests"]
