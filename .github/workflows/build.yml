name: Windows GUI release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: >-
      github.event_name == 'release' && github.event.action == 'published' &&
      github.event.release.prerelease == false && github.event.release.draft == false &&
      !contains(github.event.release.tag_name, '-') &&
      !contains(github.event.release.tag_name, 'alpha') &&
      !contains(github.event.release.tag_name, 'beta') &&
      !contains(github.event.release.tag_name, 'rc')
    runs-on: windows-latest
    env:
      PYTHON_VERSION: '3.12'
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: 'x64'
          check-latest: true

      - name: Validate Published Stable Release
        id: release
        run: python scripts/check_release_tag.py

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build Windows GUI
        run: ./scripts/build_windows.ps1 -Target Gui -Python "$env:PYTHON_VERSION"

      - name: Upload EXE and MD5 to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $ReleaseJson = gh release view "$env:RELEASE_TAG" --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Release = $ReleaseJson | ConvertFrom-Json
          if ($Release.tagName -cne $env:RELEASE_TAG -or $Release.isDraft -ne $false -or $Release.isPrerelease -ne $false) {
            throw "The release is no longer a published stable release."
          }
          $Name = "Blue-Archive-Modding-and-Patching-Tool-$env:RELEASE_TAG-windows-x64.exe"
          $Executable = Get-Item -LiteralPath (Join-Path "dist" $Name)
          $Checksum = Get-Item -LiteralPath (Join-Path "dist" "$Name.md5")
          $Expected = "{0}  {1}" -f (Get-FileHash -LiteralPath $Executable.FullName -Algorithm MD5).Hash.ToLowerInvariant(), $Name
          if ((Get-Content -LiteralPath $Checksum.FullName -Raw).Trim() -cne $Expected) {
            throw "The Windows executable checksum does not match."
          }
          gh release upload "$env:RELEASE_TAG" --clobber $Executable.FullName $Checksum.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
