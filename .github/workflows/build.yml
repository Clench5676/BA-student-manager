name: build executable file

# Releases are created locally with scripts/release.sh.
on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version (default: latest 3.12 patch)'
        type: string
        required: false
        default: '3.12'
      release:
        description: Upload assets to an existing release
        type: boolean
        default: false
      tag:
        description: 'Release tag (default: pyproject.toml version, e.g. 0.1.0-beta.1, no v)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHON_VERSION: ${{ inputs.python-version || '3.12' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: 'x64'
          check-latest: true

      - name: Check Release Tag
        if: inputs.release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/check_release_tag.py

      - name: Check Release Exists
        if: inputs.release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release view "$env:RELEASE_TAG"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build Executable with Nuitka
        run: ./scripts/build_windows.ps1 -Target Gui -Python "$env:PYTHON_VERSION"

      - name: Upload Artifact
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: Blue-Archive-Modding-and-Patching-Tool-Windows-Build
          path: dist/
          if-no-files-found: error

      - name: Upload Release Assets
        if: inputs.release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $Assets = (Get-ChildItem -Path dist/*.exe, dist/*.exe.md5).FullName
          gh release upload "$env:RELEASE_TAG" --clobber @Assets
